<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Clipboard History</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">✦</span>
        <span class="brand-text">Clipboard</span>
      </div>
      <button id="addBtn" class="fab" title="Add item manually">
        <svg id="addBtnIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </header>

    <div class="tabs-wrap">
      <div id="tabs" class="tabs"></div>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="search" type="text" placeholder="Search..." />
      </div>
      <button id="clearAll" class="icon-btn" title="Clear all unpinned items in this tab">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
        </svg>
      </button>
    </div>

    <form id="addForm" class="add-form" hidden>
      <input id="addTitle" type="text" placeholder="Title (optional)..." />
      <textarea id="addText" placeholder="Type or paste text here..." rows="3"></textarea>
      <div class="add-form-actions">
        <button type="button" id="addCancel" class="btn btn-ghost">Cancel</button>
        <button type="submit" id="addSave" class="btn btn-primary">Save</button>
      </div>
    </form>

    <ul id="list" class="list"></ul>
    <div id="empty" class="empty" hidden>
      <div class="empty-icon">🗒️</div>
      <div class="empty-text">Nothing here yet</div>
      <div class="empty-sub">Copy something, or hit + to add manually</div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
